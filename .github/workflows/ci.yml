name: CI
run-name: CI - ${{ github.event_name }} - ${{ github.ref_name }}
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      cache_mode:
        description: Native dependency/compiler archives (cold bypasses prior archives)
        type: choice
        options: [auto, cold]
        default: auto
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci --prefix docs/site
      - run: npm run check --prefix docs/site
  format:
    name: Style - clang-format 18
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full_cpp: ${{ steps.scope.outputs.full_cpp }}
      tier: ${{ steps.scope.outputs.tier }}
      source_tests: ${{ steps.scope.outputs.source_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test docs/site/scripts/ci-scope.test.mjs
      - name: Validate selective native check registration
        run: node --test tests/ci/*.test.mjs
      - id: scope
        run: node .github/scripts/ci-scope.mjs
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check project C++ formatting
        env:
          CLANG_FORMAT: clang-format-18
        run: |
          bash scripts/test_format.sh
          bash scripts/format.sh --check
  test:
    name: Native - ${{ matrix.os }} - ${{ matrix.boost == 'ON' && 'Boost - ' || matrix.boost == 'OFF' && 'Standalone - ' || '' }}${{ matrix.sanitize == 'THREAD' && 'ThreadSanitizer' || matrix.sanitize == 'ON' && 'AddressSanitizer + UndefinedBehaviorSanitizer' || 'Release' }}
    timeout-minutes: 60
    needs: format
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, boost: "ON", sanitize: "OFF"}
          - {os: ubuntu-latest, boost: "OFF", sanitize: "OFF"}
          - {os: macos-latest, boost: "BOTH", sanitize: "OFF"}
          - {os: windows-latest, boost: "ON", sanitize: "OFF"}
          - {os: windows-latest, boost: "OFF", sanitize: "OFF"}
          - {os: ubuntu-latest, boost: "BOTH", sanitize: "ON"}
          - {os: ubuntu-latest, boost: "BOTH", sanitize: "THREAD"}
    runs-on: ${{ matrix.os }}
    env:
      ARKNET_CACHE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_mode || 'auto' }}
      VCPKG_CACHE_REVISION: 0699a19d0c6386247ce50d4dedbb8217d484d536
      VCPKG_CACHE_FEATURES: boost;ssl
      VCPKG_CACHE_DEFAULT_FEATURES: 'true'
      VCPKG_CACHE_PROFILE: grouped-v2-${{ matrix.boost }}-${{ matrix.sanitize }}-${{ matrix.sanitize != 'OFF' && 'Debug' || 'Release' }}
      ARKNET_RUN_NATIVE: ${{ needs.format.outputs.full_cpp == 'true' && (needs.format.outputs.tier == 'full' || (needs.format.outputs.tier == 'modules' && matrix.os == 'ubuntu-latest' && matrix.boost == 'ON' && matrix.sanitize == 'OFF')) }}
      MATRIX_SANITIZE: ${{ matrix.sanitize }}
      ARKNET_VALIDATION_TIER: ${{ needs.format.outputs.tier }}
      ARKNET_SOURCE_TESTS: ${{ needs.format.outputs.source_tests }}
    steps:
      - name: Validate scope result
        shell: pwsh
        env:
          ARKNET_SCOPE_RESULT: ${{ needs.format.result }}
          ARKNET_FULL_CPP: ${{ needs.format.outputs.full_cpp }}
          ARKNET_VALIDATION_TIER: ${{ needs.format.outputs.tier }}
          ARKNET_SOURCE_TESTS: ${{ needs.format.outputs.source_tests }}
        run: |
          if ($env:ARKNET_CACHE_MODE -cnotin @('auto', 'cold') -or
              ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -and $env:ARKNET_CACHE_MODE -ceq 'cold')) {
            throw 'Invalid native cache mode for this event'
          }
          if ($env:ARKNET_SCOPE_RESULT -cne 'success' -or ($env:ARKNET_FULL_CPP -cne 'true' -and $env:ARKNET_FULL_CPP -cne 'false')) {
            throw 'Missing or failed CI scope validation'
          }
          if ($env:ARKNET_VALIDATION_TIER -cnotin @('full', 'modules', 'documentation') -or
              ($env:ARKNET_FULL_CPP -ceq 'false') -ne ($env:ARKNET_VALIDATION_TIER -ceq 'documentation') -or
              ($env:GITHUB_EVENT_NAME -cne 'pull_request' -and $env:ARKNET_VALIDATION_TIER -ceq 'modules') -or
              ($env:ARKNET_VALIDATION_TIER -cne 'modules' -and [string]$env:ARKNET_SOURCE_TESTS -cne '')) {
            throw 'Invalid validation tier for this event'
          }
      - name: Record planned coverage
        if: ${{ env.ARKNET_RUN_NATIVE != 'true' }}
        shell: pwsh
        run: |
          'This cell validates scope only; it did not execute native tests. PR module regression runs in Linux/Boost/TLS/Release. Code-bearing merge-group candidates require the complete native matrix; documentation-only candidates require documentation and formatting.' | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/checkout@v4
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && (runner.os == 'Windows') }}
      - uses: lukka/get-cmake@latest
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
        with:
          node-version: 26
      - name: Prepare dependency archive cache
        id: vcpkg-cache
        env:
          VCPKG_DEFAULT_TRIPLET: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'osx' || 'linux' }}
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'osx' || 'linux' }}
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
        run: node .github/scripts/vcpkg-cache.mjs
      - name: Restore dependency archives
        id: vcpkg-restore
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && steps.vcpkg-cache.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.directory }}
          key: ${{ steps.vcpkg-cache.outputs.key }}
          restore-keys: ${{ steps.vcpkg-cache.outputs.restore_keys }}
      - name: Install compiler cache
        id: sccache-setup
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
        continue-on-error: true
        uses: Mozilla-Actions/sccache-action@v0.0.11
        with:
          version: v0.16.0
          disable_annotations: true
      - name: Prepare compiler launcher
        id: compiler-cache
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache-setup.outcome }}
        run: node .github/scripts/compiler-cache.mjs --prepare
      - name: Restore compiler cache
        id: compiler-restore
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && steps.compiler-cache.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ steps.compiler-cache.outputs.directory }}
          key: ${{ steps.compiler-cache.outputs.archive_key }}
          restore-keys: ${{ steps.compiler-cache.outputs.restore_keys }}
      - name: Start compiler cache after archive restore
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && steps.compiler-cache.outputs.enabled == 'true' }}
        env:
          SCCACHE_SETUP_OUTCOME: ${{ steps.sccache-setup.outcome }}
        run: node .github/scripts/compiler-cache.mjs
      - uses: lukka/run-vcpkg@v11
        id: native-setup
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' }}
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_CACHE_REVISION }}
          vcpkgJsonGlob: vcpkg.json
      - name: Configure ThreadSanitizer address space
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && (matrix.sanitize == 'THREAD') }}
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Prepare benchmark tools
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF' && (needs.format.outputs.tier == 'full' || needs.format.outputs.source_tests == '') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Record planned coverage - Boost - TLS
        if: ${{ always() && !(env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON')) }}
        shell: pwsh
        run: '"Boost - TLS: scope-only or unavailable in this OS/check mode; no native tests executed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Configure - Boost - TLS
        id: boost-tls-configure
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs configure
      - name: Select bounded compiler parallelism - Boost - TLS
        id: boost-tls-parallel
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && matrix.sanitize == 'ON' && steps.boost-tls-configure.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs parallel
      - name: Build planned native targets - Boost - TLS
        id: boost-tls-build
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && steps.boost-tls-configure.outcome == 'success' && (matrix.sanitize != 'ON' || steps.boost-tls-parallel.outcome == 'success') && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs build
      - name: Test - Boost - TLS
        id: boost-tls-test
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && steps.boost-tls-build.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs test
      - name: Check benchmark batch runner and report calculations - Boost - TLS
        id: boost-tls-benchmark
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF' && (needs.format.outputs.tier == 'full' || needs.format.outputs.source_tests == '') && steps.boost-tls-build.outcome == 'success' && steps.boost-tls-test.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs benchmark
      - name: Record planned coverage - Boost - NoTLS
        if: ${{ always() && !(env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full') }}
        shell: pwsh
        run: '"Boost - NoTLS: scope-only or unavailable in this OS/check mode; no native tests executed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Configure - Boost - NoTLS
        id: boost-notls-configure
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs configure
      - name: Build planned native targets - Boost - NoTLS
        id: boost-notls-build
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.boost-notls-configure.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs build
      - name: Test - Boost - NoTLS
        id: boost-notls-test
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'ON') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.boost-notls-build.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'ON'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs test
      - name: Record planned coverage - Standalone - TLS
        if: ${{ always() && !(env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full') }}
        shell: pwsh
        run: '"Standalone - TLS: scope-only or unavailable in this OS/check mode; no native tests executed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Configure - Standalone - TLS
        id: standalone-tls-configure
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs configure
      - name: Select bounded compiler parallelism - Standalone - TLS
        id: standalone-tls-parallel
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full' && matrix.sanitize == 'ON' && steps.standalone-tls-configure.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs parallel
      - name: Build planned native targets - Standalone - TLS
        id: standalone-tls-build
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full' && steps.standalone-tls-configure.outcome == 'success' && (matrix.sanitize != 'ON' || steps.standalone-tls-parallel.outcome == 'success') && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs build
      - name: Test - Standalone - TLS
        id: standalone-tls-test
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full' && steps.standalone-tls-build.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs test
      - name: Check benchmark batch runner and report calculations - Standalone - TLS
        id: standalone-tls-benchmark
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && needs.format.outputs.tier == 'full' && matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF' && (needs.format.outputs.tier == 'full' || needs.format.outputs.source_tests == '') && steps.standalone-tls-build.outcome == 'success' && steps.standalone-tls-test.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'ON'
        run: node .github/scripts/native-profile.mjs benchmark
      - name: Record planned coverage - Standalone - NoTLS
        if: ${{ always() && !(env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full') }}
        shell: pwsh
        run: '"Standalone - NoTLS: scope-only or unavailable in this OS/check mode; no native tests executed." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append'
      - name: Configure - Standalone - NoTLS
        id: standalone-notls-configure
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs configure
      - name: Build planned native targets - Standalone - NoTLS
        id: standalone-notls-build
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.standalone-notls-configure.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs build
      - name: Test - Standalone - NoTLS
        id: standalone-notls-test
        if: ${{ always() && env.ARKNET_RUN_NATIVE == 'true' && (matrix.boost == 'BOTH' || matrix.boost == 'OFF') && (matrix.os == 'ubuntu-latest' && matrix.sanitize == 'OFF') && needs.format.outputs.tier == 'full' && steps.standalone-notls-build.outcome == 'success' && steps.native-setup.outcome == 'success' }}
        env:
          MATRIX_BOOST: 'OFF'
          MATRIX_SSL: 'OFF'
        run: node .github/scripts/native-profile.mjs test
      - name: Report cache statistics
        continue-on-error: true
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && always() }}
        env:
          VCPKG_ARCHIVE_DIRECTORY: ${{ steps.vcpkg-cache.outputs.directory }}
          VCPKG_ARCHIVE_HIT: ${{ steps.vcpkg-restore.outputs.cache-hit }}
          COMPILER_ARCHIVE_HIT: ${{ steps.compiler-restore.outputs.cache-hit }}
        run: node .github/scripts/cache-stats.mjs
      - name: Upload test results
        if: ${{ env.ARKNET_RUN_NATIVE == 'true' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.os }}-${{ matrix.sanitize }}
          path: |
            build/ci-*/tests/logs/**/*.log
  required:
    name: CI - required
    if: always()
    needs: [docs, format, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Collect finalized prerequisite jobs for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_JOBS_PATH: ${{ runner.temp }}/arknet-ci-jobs.json
        run: node .github/scripts/ci-jobs.mjs
      - name: Validate required coverage and actual step conclusions
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_JOBS_PATH: ${{ runner.temp }}/arknet-ci-jobs.json
        run: node .github/scripts/ci-required.mjs
