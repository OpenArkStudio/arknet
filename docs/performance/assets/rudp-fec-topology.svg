<svg xmlns="http://www.w3.org/2000/svg" width="360" height="310" viewBox="0 0 360 310" role="img" aria-labelledby="title description">
<title id="title">RUDP benchmark topology</title>
<desc id="description">Client endpoints exchange UDP datagrams with server endpoints through a bounded bidirectional UDP relay, within one process on local IPv4 loopback.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto-start-reverse"><path d="M 0 0 L 6 3 L 0 6 Z" fill="#68737d"/></marker></defs>
<rect width="360" height="310" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#20252b">
<rect x="55" y="16" width="250" height="56" rx="6" fill="#f7f9fa" stroke="#9ba4ad"/>
<text x="180" y="52" font-size="22" text-anchor="middle">Client endpoints</text>
<rect x="55" y="116" width="250" height="56" rx="6" fill="#e6f0ed" stroke="#9ba4ad"/>
<text x="180" y="152" font-size="22" text-anchor="middle">Bounded UDP relay</text>
<rect x="55" y="216" width="250" height="56" rx="6" fill="#f7f9fa" stroke="#9ba4ad"/>
<text x="180" y="252" font-size="22" text-anchor="middle">Server endpoints</text>
<path d="M 180 80 V 108" stroke="#68737d" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="202" y="100" font-size="18" text-anchor="start">UDP</text>
<path d="M 180 180 V 208" stroke="#68737d" stroke-width="1.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="202" y="200" font-size="18" text-anchor="start">UDP</text>
<text x="180" y="295" font-size="18" text-anchor="middle">Local IPv4 loopback</text>
</g></svg>
