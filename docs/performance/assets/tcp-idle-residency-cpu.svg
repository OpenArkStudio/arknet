<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title description">
<title id="title">12,500 idle TCP connections · CPU</title>
<desc id="description">Duration-weighted run means; marker = median, whiskers = three-run min/max. 9 valid intervals (~9.00 s) per endpoint/run; benchmark driver included. client: 1.824608 %, range 1.145939 to 2.074826; server: 1.415771 %, range 0.873033 to 1.618167</desc>
<metadata>Source: 2852f6030568797061ab50681f79c500a5f7039f; local Release IPv4 loopback; Boost 1.90; TLS off; three runs; error bars are min/max, not confidence intervals.</metadata>
