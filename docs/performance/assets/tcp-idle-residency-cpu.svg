<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title description">
<title id="title">12,500 idle TCP connections · CPU comparison</title>
<desc id="description">Duration-weighted run means; marker = median, whiskers = three-run min/max. CPU ranges overlap; different drivers prevent causal library-overhead or CPU-winner claims. arknet client: 1.824608 %, range 1.145939 to 2.074826; Native Asio client: 1.846484 %, range 1.815026 to 1.995347; arknet server: 1.415771 %, range 0.873033 to 1.618167; Native Asio server: 1.513240 %, range 1.504232 to 1.680562</desc>
<metadata>Benchmark code: 2852f6030568797061ab50681f79c500a5f7039f; native run checkout: docs-only descendant 9ae08dd1ff7ae1849fac61e0c5e0acb681fa6f62; local Release IPv4 loopback; Boost 1.90; TLS off; three runs per implementation; error bars are min/max, not confidence intervals; driver implementations differ.</metadata>
