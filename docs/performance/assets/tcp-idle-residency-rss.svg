<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title description">
<title id="title">12,500 idle TCP connections · RSS</title>
<desc id="description">Per-run median RSS; marker = median, whiskers = three-run min/max. Process RSS excludes kernel socket memory; no per-connection or PCU extrapolation. client: 191.015625 MiB, range 190.859375 to 191.046875; server: 165.203125 MiB, range 165.156250 to 165.390625</desc>
<metadata>Source: 2852f6030568797061ab50681f79c500a5f7039f; local Release IPv4 loopback; Boost 1.90; TLS off; three runs; error bars are min/max, not confidence intervals.</metadata>
