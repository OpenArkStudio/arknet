<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title description">
<title id="title">12,500 idle TCP connections · RSS comparison</title>
<desc id="description">Per-run median RSS; marker = median, whiskers = three-run min/max. RSS excludes kernel socket memory; driver differences preclude per-connection/PCU estimates. arknet client: 191.015625 MiB, range 190.859375 to 191.046875; Native Asio client: 122.046875 MiB, range 121.859375 to 122.046875; arknet server: 165.203125 MiB, range 165.156250 to 165.390625; Native Asio server: 114.843750 MiB, range 114.656250 to 114.906250</desc>
<metadata>Benchmark code: 2852f6030568797061ab50681f79c500a5f7039f; native run checkout: docs-only descendant 9ae08dd1ff7ae1849fac61e0c5e0acb681fa6f62; local Release IPv4 loopback; Boost 1.90; TLS off; three runs per implementation; error bars are min/max, not confidence intervals; driver implementations differ.</metadata>
