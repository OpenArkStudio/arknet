<title id="title">12,500 条空闲 TCP 连接对照 · CPU</title>
<desc id="description">区间时长加权的各次均值；圆点为中位数，误差线为三次最小/最大值 CPU 范围重叠；驱动不同，不能据此归因库开销或判定 CPU 优胜 arknet 客户端: 1.824608 %, range 1.145939 to 2.074826; 原生 Asio 客户端: 1.846484 %, range 1.815026 to 1.995347; arknet 服务端: 1.415771 %, range 0.873033 to 1.618167; 原生 Asio 服务端: 1.513240 %, range 1.504232 to 1.680562</desc>
